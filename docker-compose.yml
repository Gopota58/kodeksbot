# Деплой КодексБот: FastAPI + локальные Giga-эмбеддинги + GigaChat (внешний API Сбера).
# Артефакты (модель, индекс, корпус, сертификаты, .env) монтируются как volumes,
# НЕ запекаются в образ (см. .dockerignore: models/, chroma_db/, .env исключены).
#
# 1) docker compose up -d --build
# 2) открыть http://<VM-IP>:8000/

services:
  app:
    build: .
    container_name: kodeksbot
    ports:
      - "8000:8000"
    environment:
      # watcher отключён: в облаке на CPU reindex долгий; индекс переносим готовым
      - RAG_DISABLE_WATCHER=1
      # CPU в облаке (на GPU-хосте уберите строку или EMBED_DEVICE=cuda)
      - EMBED_DEVICE=cpu
      # GigaChat через внешний API (не Ollama)
      - LLM_PROVIDER=gigachat
      # Linux-путь к российскому CA (в .env прописан Windows-путь — переопределяем)
      - GIGACHAT_CA_BUNDLE_FILE=/app/certs/Russian_Trusted_Root_CA.pem
    volumes:
      - ./models:/app/models
      - ./data/docs:/app/data/docs
      - ./chroma_db:/app/chroma_db
      - ./certs:/app/certs
      - ./.env:/app/.env
    restart: unless-stopped
