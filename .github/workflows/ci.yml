name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # разработка вёлась на 3.14; CI — на 3.12 (шире покрытие wheels)

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # --extra-index-url обязателен: в requirements.txt torch запинен как
          # `torch==<ver>+cpu`, а сборки с локальным тегом `+cpu` публикуются
          # только на индексе PyTorch — на обычном PyPI их нет.
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        # Обязательный гейт: `ruff check .` проходит без замечаний, регресс ловим в CI.
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -q
